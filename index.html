<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aprobado o reprobado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="panel">
      <h1>Aprobado o reprobado</h1>
      <p class="intro">Ingresa los datos del estudiante y sus cuatro notas. Se aprueba con un promedio de 3.5 o más.</p>

      <form id="formulario" novalidate>
        <div class="grupo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" autocomplete="off" required>
        </div>

        <div class="grupo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" autocomplete="off" required>
        </div>

        <div class="fila">
          <div class="grupo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" min="1" max="120" step="1" required>
          </div>
          <div class="grupo">
            <label for="curso">Curso</label>
            <input type="text" id="curso" autocomplete="off" required>
          </div>
        </div>

        <fieldset>
          <legend>Notas (de 0 a 5)</legend>
          <div class="notas">
            <input type="number" class="nota" aria-label="Nota 1" min="0" max="5" step="0.1" placeholder="Nota 1" required>
            <input type="number" class="nota" aria-label="Nota 2" min="0" max="5" step="0.1" placeholder="Nota 2" required>
            <input type="number" class="nota" aria-label="Nota 3" min="0" max="5" step="0.1" placeholder="Nota 3" required>
            <input type="number" class="nota" aria-label="Nota 4" min="0" max="5" step="0.1" placeholder="Nota 4" required>
          </div>
        </fieldset>

        <p id="error" class="error" role="alert"></p>

        <div class="acciones">
          <button type="submit" class="boton">Calcular</button>
          <button type="button" id="limpiar" class="boton secundario">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="resultado" id="resultado" aria-live="polite">
      <p class="vacio" id="vacio">El resultado aparecerá aquí.</p>

      <div class="contenido" id="contenido" hidden>
        <p class="veredicto" id="veredicto"></p>
        <p class="detalle" id="detalle"></p>
        <p class="promedio">Promedio <strong id="promedio"></strong></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
